services:
  - type: web
    name: MailtraceAI
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
