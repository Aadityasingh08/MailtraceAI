<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .badge-text {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #10B981;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #CBD5E1;
    }
  </style>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="232" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Cyber Tech Grid lines -->
  <path d="M 4 80 L 996 80 M 4 160 L 996 160" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8" opacity="0.35" />
  <path d="M 250 4 L 250 236 M 500 4 L 500 236 M 750 4 L 750 236" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8" opacity="0.35" />

  <!-- Shield Icon Graphic -->
  <g transform="translate(60, 48)">
    <!-- Outer Glow -->
    <path d="M 45 10 L 80 24 C 80 70, 52 110, 45 120 C 38 110, 10 70, 10 24 Z" fill="none" stroke="#10B981" stroke-width="3" filter="url(#glow)" opacity="0.6" />
    <!-- Inner Filled Shield -->
    <path d="M 45 14 L 76 26 C 76 68, 51 104, 45 114 C 39 104, 14 68, 14 26 Z" fill="#0B1320" stroke="url(#shieldGrad)" stroke-width="2.5" />
    
    <!-- Email Envelope inside Shield -->
    <rect x="25" y="44" width="40" height="28" rx="4" fill="none" stroke="#34D399" stroke-width="2.5" />
    <path d="M 25 46 L 45 62 L 65 46" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse Radar Rings -->
    <circle cx="45" cy="58" r="4" fill="#38BDF8" />
  </g>

  <!-- Top Category Badge -->
  <g transform="translate(180, 46)">
    <rect x="0" y="0" width="235" height="26" rx="13" fill="#064E3B" opacity="0.5" stroke="#10B981" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#34D399" />
    <text x="30" y="17" class="badge-text">AUTONOMOUS SOC PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="180" y="122" class="title">MAILTRACE AI</text>

  <!-- Subtitle -->
  <text x="180" y="156" class="subtitle">Autonomous Email Threat Detection &amp; Forensic Intelligence Cockpit</text>

  <!-- Feature Pills -->
  <g transform="translate(180, 182)">
    <rect x="0" y="0" width="138" height="24" rx="6" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="12" y="16" class="pill-text">RFC 5322 TELEMETRY</text>

    <rect x="150" y="0" width="130" height="24" rx="6" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="162" y="16" class="pill-text">QUISHING SCANNER</text>

    <rect x="292" y="0" width="136" height="24" rx="6" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="304" y="16" class="pill-text">APT ATTRIBUTION</text>

    <rect x="440" y="0" width="130" height="24" rx="6" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="452" y="16" class="pill-text">SOAR PLAYBOOKS</text>

    <rect x="582" y="0" width="130" height="24" rx="6" fill="#1E293B" opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="594" y="16" class="pill-text">YARA &amp; SIGMA LAB</text>
  </g>
</svg>
